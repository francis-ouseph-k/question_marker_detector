[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "question-marker-detector"
version = "1.0.0"
description = "Detects handwritten question markers in scanned answer scripts and locates answer starts"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26,<3",
    # OpenCV is provided by the chosen backend extra (paddle -> opencv-contrib-python via paddlex,
    # onnx -> opencv-python). Two OpenCV packages in one environment break `import cv2`.
    "pypdfium2>=4.30,<6",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# Default OCR backend (TD §3.1): PaddleOCR 3.x with PP-OCRv5 Mobile models.
paddle = [
    "paddlepaddle==3.2.2",
    "paddleocr==3.3.3",
]
# Alternative backend: PP-OCR models on ONNX Runtime (via RapidOCR). Works offline.
onnx = [
    "opencv-python>=4.9",
    "rapidocr==3.9.2",
    "onnxruntime>=1.18,<2",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pillow>=10",   # tests build synthetic PDFs
]

[project.scripts]
qmd = "qmd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ocr: tests that need a real OCR backend and the sample PDFs (skipped by default)",
]

[tool.ruff]
line-length = 132
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP007", "UP045", "B905"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
